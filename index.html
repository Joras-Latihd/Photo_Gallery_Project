<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Top 10 Ballon d'Or 2025 Predictions | Saroj Dhital</title>
    <meta
      name="description"
      content="My Top 10 Ballon d'Or 2025 ranking predictions, with a full-screen photo viewer."
    />
    <meta name="theme-color" content="#070b14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">Ballon d'Or &middot; Predictions</p>
      <h1><span>Top 10</span> Ballon d'Or Ranking Predictions 2025</h1>
      <p class="byline">Ranked by Saroj Dhital</p>
    </header>

    <main>
      <ul class="gallery" id="gallery" aria-label="Top 10 players"></ul>
    </main>

    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Photo viewer"
      inert
    >
      <div class="lb-top">
        <span class="counter" id="counter"></span>
        <button
          class="icon"
          id="closeBtn"
          type="button"
          aria-label="Close viewer"
        >
          &times;
        </button>
      </div>
      <div class="stage" id="stage">
        <button
          class="nav"
          id="prevBtn"
          type="button"
          aria-label="Previous photo"
        >
          &#10094;
        </button>
        <figure class="figure">
          <img id="lightboxImg" alt="" />
          <figcaption>
            <strong id="lightboxTitle"></strong>
            <span id="lightboxSubtitle"></span>
          </figcaption>
        </figure>
        <button class="nav" id="nextBtn" type="button" aria-label="Next photo">
          &#10095;
        </button>
      </div>
      <div class="thumbs" id="thumbnails" aria-label="All photos"></div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
